# Secret scanning with Gitleaks over the full git history.
# Runs first in every PR: a leaked credential invalidates everything after it.
parameters:
  - name: gitleaksVersion
    type: string
    default: "8.18.4" # pinned; upgrades are explicit PRs

steps:
  - script: |
      set -euo pipefail
      curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${{ parameters.gitleaksVersion }}/gitleaks_${{ parameters.gitleaksVersion }}_linux_x64.tar.gz" \
        | tar -xz gitleaks
      ./gitleaks detect \
        --source . \
        --config .gitleaks.toml \
        --report-format sarif \
        --report-path $(Build.ArtifactStagingDirectory)/gitleaks-report.sarif \
        --redact \
        --exit-code 1
    displayName: "Security: secret scan (gitleaks ${{ parameters.gitleaksVersion }})"

  - publish: $(Build.ArtifactStagingDirectory)/gitleaks-report.sarif
    artifact: gitleaks-report
    condition: succeededOrFailed()
    displayName: "Publish gitleaks report"
